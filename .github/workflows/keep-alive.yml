name: Keep Scheduled Workflows Active

# GitHub 会在公开仓库连续 60 天无活动后停用 schedule。
# 每月提交一次时间戳即可，无需每天制造提交。
on:
  schedule:
    - cron: '23 3 1 * *'
  workflow_dispatch:

concurrency:
  group: keep-scheduled-workflows-active
  cancel-in-progress: false

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # 自愈：若签到等 schedule 工作流被 GitHub 以 "disabled_inactivity" 停用，
      # 这里自动重新启用，避免 2026-04~09 那种半年停摆再次发生。
      - name: Re-enable disabled scheduled workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for wf in checkin.yml keep-alive.yml; do
            state=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/$wf" \
              | jq -r '.state')
            echo "$wf state: $state"
            case "$state" in
              disabled_inactivity|disabled_manually)
                code=$(curl -s -o /dev/null -w "%{http_code}" -X PUT \
                  -H "Authorization: Bearer $GH_TOKEN" \
                  "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/$wf/enable")
                echo "  -> re-enabled (HTTP $code)"
                ;;
            esac
          done

      - name: Update timestamp
        run: |
          echo "Last active: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" > .github/last-active.txt

      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .github/last-active.txt
          git diff --staged --quiet || git commit -m "chore: keep repository active [skip ci]"
          git pull --rebase origin main
          git push
